    and prints only the aggregate summary (never a per-case result) before the run completes.

frozen_model:
  decision_model: openai/gpt-4o-mini   # from .env PAID_MODEL; used for the LLM-residual step only
  embedding_model: voyageai/voyage-4-lite
  temperature: 0
  max_tokens: 600   # via src/llm_exp.run's default
  decoding: OpenRouter default (top_p etc. unset/provider default); JSON mode enforced via response_format
  disclosed_caveat: OpenRouter's provider routing/backend for openai/gpt-4o-mini is not fully reproducible outside our
    control (the underlying provider or backend behind the OpenRouter endpoint can change over time). This is accepted
    and disclosed rather than worked around by switching models at freeze time.

frozen_retriever_config:
  chunking: fixed600_100
  top_k: 8
  metadata_filter: M4 (date + region + authoritative-document-type + expense-category compatibility; src/resolver.py's _mask, identical to Exp 9's M4)
  query: raw claim-derived query (retrieval.claim_query), no rewriting (Exp 10 found rewriting did not help downstream)

frozen_routing_logic:
  conclusiveness_signal: src/resolver.py:deterministic() — a claim is conclusive iff (a) the deterministic rule engine
    (rules_text.parse + rules_v2.decide) reaches a decision other than its "No rule triggered." fallback, AND (b) every
    note-parsed field that expense type's category function needs (the NEEDED dict) was actually extracted (not None).
    This signal is visible-only: it never reads a label, case_family, or expected_decision.
  deterministic_path: conclusive claims use the deterministic decision directly, no LLM call.
  llm_residual_path: non-conclusive claims get M4 RAG excerpts + H1-H4 resolved facts (src/hybrid_facts.py) and the LLM
    (SYSTEM_LLM_STEP in src/resolver.py) makes the final call.
  known_open_limitations (not fixed for this run, carried forward from Exp 28):
    - retrieval-text injection can still defeat the LLM-residual step's prompt-level defence; no structural isolation
      of retrieved text is implemented.
    - the LLM-residual step's own reliability is measured at 36.1% accuracy on development (Exp 30) — the weakest part
      of the frozen pipeline, known and accepted for this run.

frozen_evaluator:
  module: src/evaluate.py (evaluate.evaluate), unchanged since Exp 2
  ground_truth: ExpenseGuard_V2_DATASET/04_ground_truth_PRIVATE/ground_truth.jsonl, opened only by the evaluator after
    predictions are produced, per the project's standing leakage rule (tests/test_no_leakage.py)

cache_policy:
  llm_calls: cached on disk (results/cache/), keyed by [model, messages, temperature, max_tokens] (+ non-default
    local num_ctx where applicable); a fresh final-test claim's exact prompt has not been seen before, so this run
    is expected to be a live run, not a cache replay, except by coincidence.
  embeddings: cached the same way (results/cache/emb/); the final-test claims' embeddings have not been computed before.
  budget_cap: MAX_BUDGET_USD=3.50 (.env); spend before this run: ~$2.139; projected cost for 50 claims at the LLM-residual
    rate observed in Exp 30 (51% of claims, ~$0.00083/claim on that path) is well under $0.05.

process_rule:
  statement: >
    No code, prompt, retriever setting, conclusiveness threshold, or evaluator logic listed above may change after
    the final-test predictions are produced and viewed. If Exp 32's results reveal a bug or a desired change, that
    change is documented as a finding for a *future* experiment, not applied retroactively to this run's numbers.
    Individual final-test cases are not inspected mid-run, and no failed case is rerun in isolation: the full batch
    of 50 completes, the outputs are locked (saved to disk) exactly as produced, and only then is any analysis performed.
